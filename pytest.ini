# =============================================================================
# pytest.ini — configuración de la suite de tests del MCP HUB Server IA
# =============================================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q

# Los tests deben aislarse de la red: se usa fakeapi / mocks.
filterwarnings =
    ignore::There is no current event loop
    ignore::coroutine .* was never awaited