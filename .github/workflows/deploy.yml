# =============================================================================
# .github/workflows/deploy.yml — MCP HUB Server IA
# -----------------------------------------------------------------------------
# Despliegue SIMPLE a Azure Web App (Python 3.11 runtime) — SIN Docker.
#
# Con un `git push` a main se despliega el código a tu Web App de Azure.
# Azure (runtime Python) instala `requirements.txt` y lanza `uvicorn`
# usando el comando del `Procfile`.
#
# Requisitos previos en Azure:
#   1) Web App + App Service Plan (Linux, Python 3.11)   [Runtime: Python]
#   2) PostgreSQL Flexible Server  ->  App Settings:  DATABASE_URL
#   3) Publicar el "Publish Profile" (XML) de la Web App como secreto de GitHub:
#         Settings >> Secrets and variables >> Actions >> New repository secret
#         Name: AZURE_WEBAPP_PUBLISH_PROFILE
#         Valor: contenido completo del .PublishSettings XML
#   4) Variables en App Settings (Web App config):
#         DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/db?sslmode=require
#         OPENROUTER_API_KEY=...
#         MAX_SUBMISSION_ATTEMPTS=2
#         LOG_LEVEL=INFO
# =============================================================================

name: Deploy to Azure Web App (Python runtime)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: mcp-hub-eva        # nombre de tu Web App en Azure
  AZURE_WEBAPP_PACKAGE_PATH: "."

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que el proyecto importa
        run: |
          python -c "import fastapi, uvicorn, asyncpg; print('deps OK')"
          python -c "from API.config import settings; print('config OK')"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar a Azure Web App (código)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          startup-command: "uvicorn API.server:app --host 0.0.0.0 --port 8000 --workers 1"