# Despliegue manual y protegido a Azure. No usar para el servidor on-prem.
# Requiere el GitHub Environment `production-azure` con revisores obligatorios,
# variables AZURE_WEBAPP_NAME/AZURE_WEBAPP_URL y secreto
# AZURE_WEBAPP_PUBLISH_PROFILE. La red y el runtime se configuran fuera de Actions.
name: Deploy Azure production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
  AZURE_WEBAPP_PACKAGE_PATH: "."

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Ejecutar suite automatizada
        run: python -m pytest tests -q -o filterwarnings=ignore

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production-azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuración de despliegue
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || { echo "Falta AZURE_WEBAPP_NAME"; exit 1; }
          test -n "$AZURE_WEBAPP_URL" || { echo "Falta AZURE_WEBAPP_URL"; exit 1; }
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || { echo "Falta AZURE_WEBAPP_PUBLISH_PROFILE en production-azure"; exit 1; }

      - name: Desplegar a Azure Web App (código)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          startup-command: "uvicorn API.server:app --host 0.0.0.0 --port 8000 --workers 1"

      - name: Smoke test de liveness
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-connrefused \
            "${AZURE_WEBAPP_URL%/}/health"
